[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lecture-study-assistant"
version = "0.1.0"
description = "A local-first assistant for studying university lecture materials."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40,<2.0",
    "google-genai>=1.0,<2.0",
    "pytesseract>=0.3.10,<0.4",
    "pydantic>=2.7,<3.0",
    "Pillow>=10.0,<13.0",
    "PyMuPDF>=1.24,<2.0",
    "python-docx>=1.1,<2.0",
    "python-pptx>=1.0,<2.0",
    "streamlit>=1.40,<2.0",
    "python-dotenv>=1.0,<2.0",
    "reportlab>=4.0,<5.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
